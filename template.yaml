AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  GWEB merchant onboarding — Phase 1 (IaC foundation, core application CRUD).
  See GWEB_Implementation_Spec.md. Document upload, MCC/classify, AI
  evaluation, and submit are later phases and are intentionally absent here.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 45 # hard budget per spec §1.3; handlers target a 30s soft deadline within it
    MemorySize: 256
    Layers:
      - !Ref DependenciesLayer
    Environment:
      Variables:
        TABLE_NAME: !Ref OnboardingTable

Resources:
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: gweb-onboarding-dependencies
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  OnboardingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: gweb-onboarding
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # Not used by any Phase 1 handler — defined now per spec §4 as the IaC
  # foundation for the document-upload flow (a later phase).
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OnboardingHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - X-Application-Token
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS

  CreateApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-create-application
      CodeUri: src/
      Handler: handlers.create_application.handler
      Events:
        CreateApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications
            Method: post
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt OnboardingTable.Arn

  GetApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-get-application
      CodeUri: src/
      Handler: handlers.get_application.handler
      Events:
        GetApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications/{id}
            Method: get
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt OnboardingTable.Arn

  PatchApplicantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-patch-applicant
      CodeUri: src/
      Handler: handlers.patch_applicant.handler
      Events:
        PatchApplicant:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications/{id}/applicant
            Method: patch
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OnboardingTable.Arn

  PatchBusinessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-patch-business
      CodeUri: src/
      Handler: handlers.patch_business.handler
      Events:
        PatchBusiness:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications/{id}/business
            Method: patch
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OnboardingTable.Arn

Outputs:
  ApiUrl:
    Description: Base URL for the v1 API
    Value: !Sub "https://${OnboardingHttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
  TableName:
    Value: !Ref OnboardingTable
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
