AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  GWEB merchant onboarding — Phase 1 (core application CRUD), Phase 2
  (document upload: presign/complete), and Phase 3 (MCC search/classify/
  confirm). See GWEB_Implementation_Spec.md. AI evaluation and submit are
  later phases, still absent.

Parameters:
  MaxDocumentSizeBytes:
    Type: Number
    Default: 15728640 # 15 MB — configurable per approved Phase 2 decisions
    Description: Maximum accepted document size in bytes, enforced at presign (declared) and complete (actual) time.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 45 # hard budget per spec §1.3; handlers target a 30s soft deadline within it
    MemorySize: 256
    Layers:
      - !Ref DependenciesLayer
    Environment:
      Variables:
        TABLE_NAME: !Ref OnboardingTable

Resources:
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: gweb-onboarding-dependencies
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  OnboardingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: gweb-onboarding
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # Not used by any Phase 1 handler — defined now per spec §4 as the IaC
  # foundation for the document-upload flow (a later phase).
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OnboardingHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v1
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - X-Application-Token
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS

  CreateApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-create-application
      CodeUri: src/
      Handler: handlers.create_application.handler
      Events:
        CreateApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications
            Method: post
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt OnboardingTable.Arn

  GetApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-get-application
      CodeUri: src/
      Handler: handlers.get_application.handler
      Events:
        GetApplication:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications/{id}
            Method: get
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt OnboardingTable.Arn

  PatchApplicantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-patch-applicant
      CodeUri: src/
      Handler: handlers.patch_applicant.handler
      Events:
        PatchApplicant:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications/{id}/applicant
            Method: patch
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OnboardingTable.Arn

  PatchBusinessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-patch-business
      CodeUri: src/
      Handler: handlers.patch_business.handler
      Events:
        PatchBusiness:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications/{id}/business
            Method: patch
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OnboardingTable.Arn

  PresignDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-presign-document
      CodeUri: src/
      Handler: handlers.presign_document.handler
      Environment:
        Variables:
          DOCUMENTS_BUCKET_NAME: !Ref DocumentsBucket
          MAX_DOCUMENT_SIZE_BYTES: !Ref MaxDocumentSizeBytes
      Events:
        PresignDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications/{id}/documents/presign
            Method: post
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt OnboardingTable.Arn
            - Effect: Allow
              # Required so the presigned PUT URL this function mints is
              # actually usable — S3 authorizes the *signing* principal's
              # permissions when the client later performs the upload.
              Action:
                - s3:PutObject
              Resource: !Sub "${DocumentsBucket.Arn}/applications/*/documents/*"

  CompleteDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-complete-document
      CodeUri: src/
      Handler: handlers.complete_document.handler
      Environment:
        Variables:
          DOCUMENTS_BUCKET_NAME: !Ref DocumentsBucket
          MAX_DOCUMENT_SIZE_BYTES: !Ref MaxDocumentSizeBytes
      Events:
        CompleteDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications/{id}/documents/{documentId}/complete
            Method: post
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt OnboardingTable.Arn
            - Effect: Allow
              # Covers both HeadObject and GetObject — S3 has no separate
              # HeadObject IAM action.
              Action:
                - s3:GetObject
              Resource: !Sub "${DocumentsBucket.Arn}/applications/*/documents/*"

  SearchMccFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-search-mcc
      CodeUri: src/
      Handler: handlers.search_mcc.handler
      Events:
        SearchMcc:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /mcc
            Method: get
      # No Policies — the catalog is a packaged file (src/data/), never
      # DynamoDB or any other AWS resource. Not application-scoped, so no
      # auth either (spec §3: this route has no {id} path parameter).

  ClassifyMccFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-classify-mcc
      CodeUri: src/
      Handler: handlers.classify_mcc.handler
      Events:
        ClassifyMcc:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications/{id}/classify
            Method: post
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt OnboardingTable.Arn

  ConfirmMccFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gweb-confirm-mcc
      CodeUri: src/
      # Decision #1: a separate confirmation endpoint (not in the original
      # spec §3 table) — justified because the assessment requires
      # applicant confirmation/correction of the system's MCC proposal.
      Handler: handlers.confirm_mcc.handler
      Events:
        ConfirmMcc:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardingHttpApi
            Path: /applications/{id}/mcc/confirm
            Method: post
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt OnboardingTable.Arn

Outputs:
  ApiUrl:
    Description: Base URL for the v1 API
    Value: !Sub "https://${OnboardingHttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
  TableName:
    Value: !Ref OnboardingTable
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
